name: CI / CD & Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Phase 6 release gate
        run: npm run test:phase6

      - name: Output quality gate
        run: npm run test:quality

  deploy:
    name: Deploy to AWS EC2
    needs: quality
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting Automated Deployment on EC2..."
            APP_DIR="/home/ubuntu/verasity"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # 1. Update repository code
            if [ -d .git ]; then
              echo "📦 Pulling latest changes from git..."
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # 2. Automatically generate and update server .env from GitHub Secrets
            echo "🔐 Synchronizing .env with GitHub Secrets..."
            printf "%s\n" \
              "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
              "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
              "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              "GEMINI_API_KEY_FALLBACK=${{ secrets.GEMINI_API_KEY_FALLBACK }}" \
              "GEMINI_API_KEY_FALLBACK_2=${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}" \
              "GEMINI_MODEL=gemini-3.1-flash-lite" \
              "GEMINI_EMBEDDING_MODEL=gemini-embedding-001" \
              "FIRECRAWL_API_KEY=${{ secrets.FIRECRAWL_API_KEY }}" \
              "SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}" \
              "SCRAPE_DO_TOKEN=${{ secrets.SCRAPE_DO_TOKEN }}" \
              "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" \
              "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" \
              "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "NEXT_PUBLIC_FF_LANGGRAPH_EXECUTOR=1" \
              "INNGEST_DEV=1" > $APP_DIR/.env

            # 3. Install dependencies
            echo "📦 Installing npm dependencies..."
            npm install --prefer-offline --no-audit

            # 4. Run database migrations
            echo "🗄️ Running database migrations..."
            node scripts/apply-local-schema.mjs || true
            node scripts/db-migrate.mjs || true

            # 5. Build Next.js production bundle
            echo "⚡ Compiling production build..."
            npm run build

            # 6. Restart/Reload application via PM2
            echo "🔄 Reloading PM2 process..."
            pm2 restart verasity --update-env || pm2 start npm --name "verasity" -- start
            pm2 save

            echo "✅ Deployment completed successfully!"
